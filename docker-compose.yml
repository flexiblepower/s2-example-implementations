services:
  # pv-installation:
  #   build: ./pv-installation
  #   environment:
  #     # Provide the URL to your CEM here; this should be a WebSocket endpoint
  #     - CEM_URL=ws://localhost:1234
  #     # Supported values:
  #     # - PEBC: PV installation that can curtail
  #     # - NOT_CONTROLABLE: PV installation without the option to curtail
  #     - CONTROL_TYPE=PEBC

  battery:
    build: ./battery
    env_file: .env # Put AUTH_TOKEN=your_auth_token in .env
    environment:
      # Provide the URL to your CEM here; this should be a WebSocket endpoint
      - CEM_URL=wss://ws.seita.energy/s2
      - RUST_BACKTRACE=1
      - RUST_LOG=battery=trace,s2energy=trace
      # Supported values:
      # - FRBC: home battery that can charge and discharge
      - CONTROL_TYPE=FRBC